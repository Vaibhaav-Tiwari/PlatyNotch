name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Go core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  mac:
    name: Mac app (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: swift test
        working-directory: apps/mac
        run: swift test
      # An expression that is slow to type-check locally can time out on this runner's
      # compiler and fail the build ("unable to type-check ... in reasonable time").
      # Name the slow ones with a clear message before that happens.
      - name: type-check time
        working-directory: apps/mac
        run: |
          status=0
          swift build --scratch-path .build-typecheck \
            -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300 > typecheck.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            cat typecheck.log
            exit "$status"
          fi
          if grep -q "expression took" typecheck.log; then
            grep "expression took" typecheck.log | sort -u
            echo "Break these expressions up: they type-check slowly and may time out on other compilers."
            exit 1
          fi
      - name: script tests
        run: |
          scripts/tests/version_test.sh
          scripts/tests/appcast_test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh scripts/tests/*.sh
